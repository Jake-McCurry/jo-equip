<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C08D"/>
      <stop offset="50%" stop-color="#C69C6D"/>
      <stop offset="100%" stop-color="#9A7446"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#E8E4DB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1C2A39" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <g id="ornate-throne">
      <!-- Base -->
      <path d="M-70,80 L70,80 L60,110 L-60,110 Z" fill="url(#gold)" filter="url(#shadow)"/>
      <rect x="-60" y="70" width="120" height="10" fill="#1C2A39"/>
      <!-- Seat -->
      <path d="M-80,50 L80,50 L70,70 L-70,70 Z" fill="url(#gold)"/>
      <rect x="-70" y="40" width="140" height="10" fill="#265C59"/>
      <!-- Backrest -->
      <path d="M-60,40 L-50,-70 C-50,-110 50,-110 50,-70 L60,40 Z" fill="#265C59" stroke="url(#gold)" stroke-width="6"/>
      <path d="M-45,40 L-35,-65 C-35,-90 35,-90 35,-65 L45,40 Z" fill="#1C2A39"/>
      <!-- Arms -->
      <path d="M-80,50 C-100,10 -50,-10 -50,30" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
      <path d="M80,50 C100,10 50,-10 50,30" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
      <!-- Cushion -->
      <path d="M-50,30 L50,30 C60,45 -60,45 -50,30 Z" fill="#A74B39"/>
    </g>

    <g id="radiant-cross">
      <circle r="70" fill="#E2C08D" opacity="0.3" filter="url(#glow)"/>
      <rect x="-8" y="-45" width="16" height="110" fill="#FDFBF7" stroke="url(#gold)" stroke-width="2"/>
      <rect x="-35" y="-15" width="70" height="16" fill="#FDFBF7" stroke="url(#gold)" stroke-width="2"/>
    </g>

    <g id="self-symbol">
      <circle r="30" fill="#1C2A39" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)"/>
      <text y="12" font-family="'Cormorant Garamond', serif" font-size="36" font-weight="700" fill="#FDFBF7" text-anchor="middle">S</text>
    </g>

    <g id="leaf-gold">
      <path d="M 0,0 C -30,-20 -50,20 -70,40 C -30,60 -10,20 0,0 Z" fill="url(#gold)" filter="url(#shadow)"/>
    </g>
    <g id="leaf-teal">
      <path d="M 0,0 C 30,-20 50,20 70,40 C 30,60 10,20 0,0 Z" fill="#265C59" filter="url(#shadow)"/>
    </g>
    <g id="grape">
      <circle cx="0" cy="15" r="8" fill="#1C2A39" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="-8" cy="28" r="8" fill="#1C2A39" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="8" cy="28" r="8" fill="#1C2A39" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="0" cy="41" r="8" fill="#1C2A39" stroke="url(#gold)" stroke-width="1.5"/>
    </g>

    <g id="stone-spout">
      <path d="M -40,-30 C -20,0 20,0 40,-30 L 25,30 C 10,40 -10,40 -25,30 Z" fill="url(#gold)" filter="url(#shadow)"/>
      <ellipse cx="0" cy="-30" rx="40" ry="15" fill="#1C2A39"/>
      <rect x="-10" y="30" width="20" height="20" fill="url(#gold)"/>
      <path d="M -30,50 L 30,50 L 20,60 L -20,60 Z" fill="#9A7446"/>
    </g>
  </defs>

  <style>
    
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=Proza+Libre:wght@400;500;600&amp;display=swap');
  text { font-family: 'Proza Libre', sans-serif; fill: #1C2A39; }
  .title { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 48px; fill: #1C2A39; letter-spacing: 2px; text-anchor: middle; }
  .ref { font-family: 'Proza Libre', sans-serif; font-weight: 400; font-size: 22px; fill: #A74B39; }

    .fruit-text { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 700; font-size: 42px; fill: #1C2A39; }
  </style>
  
  <rect width="1200" height="1500" fill="#FDFBF7"/>
  <rect x="30" y="30" width="1140" height="1440" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <rect x="40" y="40" width="1120" height="1420" fill="none" stroke="#265C59" stroke-width="1" opacity="0.3"/>

  
  <text x="600" y="140" class="title" style="font-size: 64px;">Fruit of the Spirit</text>

  <rect x="560" y="250" width="80" height="1150" fill="#E8E4DB" stroke="#C69C6D" stroke-width="2" rx="40" filter="url(#shadow)"/>
  
  <path d="M 600,1400 C 400,1300 800,1200 600,1050 C 400,950 800,850 600,750 C 400,650 800,550 600,450 C 450,380 750,350 600,320" fill="none" stroke="#265C59" stroke-width="24" stroke-linecap="round"/>
  <path d="M 600,1400 C 400,1300 800,1200 600,1050 C 400,950 800,850 600,750 C 400,650 800,550 600,450 C 450,380 750,350 600,320" fill="none" stroke="#1C2A39" stroke-width="6" stroke-dasharray="30 20" stroke-linecap="round"/>

  <g transform="translate(480, 1280)">
    <use href="#leaf-gold" x="0" y="0"/>
    <use href="#grape" x="-30" y="20"/>
    <text x="-90" y="45" class="fruit-text" text-anchor="end">Love</text>
  </g>

  <g transform="translate(720, 1160)">
    <use href="#leaf-teal" x="0" y="0"/>
    <use href="#grape" x="30" y="20"/>
    <text x="90" y="45" class="fruit-text" text-anchor="start">Joy</text>
  </g>

  <g transform="translate(480, 1040)">
    <use href="#leaf-teal" x="0" y="0"/>
    <use href="#grape" x="-30" y="20"/>
    <text x="-90" y="45" class="fruit-text" text-anchor="end">Peace</text>
  </g>

  <g transform="translate(720, 920)">
    <use href="#leaf-gold" x="0" y="0"/>
    <use href="#grape" x="30" y="20"/>
    <text x="90" y="45" class="fruit-text" text-anchor="start">Patience</text>
  </g>

  <g transform="translate(480, 800)">
    <use href="#leaf-gold" x="0" y="0"/>
    <use href="#grape" x="-30" y="20"/>
    <text x="-90" y="45" class="fruit-text" text-anchor="end">Kindness</text>
  </g>

  <g transform="translate(720, 680)">
    <use href="#leaf-teal" x="0" y="0"/>
    <use href="#grape" x="30" y="20"/>
    <text x="90" y="45" class="fruit-text" text-anchor="start">Goodness</text>
  </g>

  <g transform="translate(480, 560)">
    <use href="#leaf-teal" x="0" y="0"/>
    <use href="#grape" x="-30" y="20"/>
    <text x="-90" y="45" class="fruit-text" text-anchor="end">Faithfulness</text>
  </g>

  <g transform="translate(720, 440)">
    <use href="#leaf-gold" x="0" y="0"/>
    <use href="#grape" x="30" y="20"/>
    <text x="90" y="45" class="fruit-text" text-anchor="start">Gentleness</text>
  </g>

  <g transform="translate(600, 320)">
    <use href="#leaf-gold" x="-20" y="-10" transform="rotate(45)"/>
    <use href="#leaf-teal" x="20" y="-10" transform="rotate(-45)"/>
    <use href="#grape" x="0" y="-10"/>
    <text x="0" y="-50" class="fruit-text" text-anchor="middle">Self-control</text>
  </g>
</svg>