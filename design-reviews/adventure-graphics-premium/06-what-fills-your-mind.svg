<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
  
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C08D"/>
      <stop offset="50%" stop-color="#C69C6D"/>
      <stop offset="100%" stop-color="#9A7446"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#E8E4DB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1C2A39" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <g id="ornate-throne">
      <!-- Base -->
      <path d="M-70,80 L70,80 L60,110 L-60,110 Z" fill="url(#gold)" filter="url(#shadow)"/>
      <rect x="-60" y="70" width="120" height="10" fill="#1C2A39"/>
      <!-- Seat -->
      <path d="M-80,50 L80,50 L70,70 L-70,70 Z" fill="url(#gold)"/>
      <rect x="-70" y="40" width="140" height="10" fill="#265C59"/>
      <!-- Backrest -->
      <path d="M-60,40 L-50,-70 C-50,-110 50,-110 50,-70 L60,40 Z" fill="#265C59" stroke="url(#gold)" stroke-width="6"/>
      <path d="M-45,40 L-35,-65 C-35,-90 35,-90 35,-65 L45,40 Z" fill="#1C2A39"/>
      <!-- Arms -->
      <path d="M-80,50 C-100,10 -50,-10 -50,30" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
      <path d="M80,50 C100,10 50,-10 50,30" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
      <!-- Cushion -->
      <path d="M-50,30 L50,30 C60,45 -60,45 -50,30 Z" fill="#A74B39"/>
    </g>

    <g id="radiant-cross">
      <circle r="70" fill="#E2C08D" opacity="0.3" filter="url(#glow)"/>
      <rect x="-8" y="-45" width="16" height="110" fill="#FDFBF7" stroke="url(#gold)" stroke-width="2"/>
      <rect x="-35" y="-15" width="70" height="16" fill="#FDFBF7" stroke="url(#gold)" stroke-width="2"/>
    </g>

    <g id="self-symbol">
      <circle r="30" fill="#1C2A39" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)"/>
      <text y="12" font-family="'Cormorant Garamond', serif" font-size="36" font-weight="700" fill="#FDFBF7" text-anchor="middle">S</text>
    </g>

    <g id="leaf-gold">
      <path d="M 0,0 C -30,-20 -50,20 -70,40 C -30,60 -10,20 0,0 Z" fill="url(#gold)" filter="url(#shadow)"/>
    </g>
    <g id="leaf-teal">
      <path d="M 0,0 C 30,-20 50,20 70,40 C 30,60 10,20 0,0 Z" fill="#265C59" filter="url(#shadow)"/>
    </g>
    <g id="grape">
      <circle cx="0" cy="15" r="8" fill="#1C2A39" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="-8" cy="28" r="8" fill="#1C2A39" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="8" cy="28" r="8" fill="#1C2A39" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="0" cy="41" r="8" fill="#1C2A39" stroke="url(#gold)" stroke-width="1.5"/>
    </g>

    <g id="stone-spout">
      <path d="M -40,-30 C -20,0 20,0 40,-30 L 25,30 C 10,40 -10,40 -25,30 Z" fill="url(#gold)" filter="url(#shadow)"/>
      <ellipse cx="0" cy="-30" rx="40" ry="15" fill="#1C2A39"/>
      <rect x="-10" y="30" width="20" height="20" fill="url(#gold)"/>
      <path d="M -30,50 L 30,50 L 20,60 L -20,60 Z" fill="#9A7446"/>
    </g>
  </defs>

  <style>
    
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=Proza+Libre:wght@400;500;600&amp;display=swap');
  text { font-family: 'Proza Libre', sans-serif; fill: #1C2A39; }
  .title { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 48px; fill: #1C2A39; letter-spacing: 2px; text-anchor: middle; }
  .ref { font-family: 'Proza Libre', sans-serif; font-weight: 400; font-size: 22px; fill: #A74B39; }

    .spout-label { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 38px; fill: #1C2A39; }
    .mind-label { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 52px; fill: #FDFBF7; letter-spacing: 4px; }
    .flow-label { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 700; font-size: 42px; fill: #265C59; }
  </style>
  
  <rect width="1400" height="1400" fill="#FDFBF7"/>
  <rect x="30" y="30" width="1340" height="1340" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <rect x="40" y="40" width="1320" height="1320" fill="none" stroke="#265C59" stroke-width="1" opacity="0.3"/>


  <g transform="translate(450, 350)">
    <use href="#stone-spout" x="0" y="0"/>
    <text x="0" y="-90" class="spout-label" text-anchor="middle">GOD's</text>
    <text x="0" y="-45" class="spout-label" text-anchor="middle">VIEWPOINT</text>
  </g>

  <g transform="translate(950, 350)">
    <use href="#stone-spout" x="0" y="0"/>
    <text x="0" y="-90" class="spout-label" text-anchor="middle">WORLD's</text>
    <text x="0" y="-45" class="spout-label" text-anchor="middle">VIEWPOINT</text>
  </g>

  <path d="M 450,400 C 450,550 550,650 600,750" fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
  <path d="M 450,400 C 450,550 550,650 600,750" fill="none" stroke="#FDFBF7" stroke-width="10" stroke-linecap="round"/>
  
  <path d="M 950,400 C 950,550 850,650 800,750" fill="none" stroke="#1C2A39" stroke-width="24" stroke-linecap="round" opacity="0.8"/>
  <path d="M 950,400 C 950,550 850,650 800,750" fill="none" stroke="#265C59" stroke-width="8" stroke-linecap="round"/>

  <g transform="translate(700, 800)">
    <ellipse cx="0" cy="-80" rx="300" ry="60" fill="#468884" opacity="0.8"/>
    <ellipse cx="0" cy="-80" rx="200" ry="40" fill="none" stroke="#FDFBF7" stroke-width="4" opacity="0.5"/>
    <ellipse cx="0" cy="-80" rx="100" ry="20" fill="none" stroke="#FDFBF7" stroke-width="4" opacity="0.5"/>
    
    <path d="M -300,-80 C -300,120 -150,200 0,200 C 150,200 300,120 300,-80 C 300,-40 150,-10 0,-10 C -150,-10 -300,-40 -300,-80 Z" fill="#1C2A39" filter="url(#shadow)"/>
    <path d="M -300,-80 C -300,120 -150,200 0,200 C 150,200 300,120 300,-80 Z" fill="url(#silver)" opacity="0.1"/>
    
    <ellipse cx="0" cy="-80" rx="300" ry="60" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <ellipse cx="0" cy="-80" rx="290" ry="50" fill="none" stroke="#E2C08D" stroke-width="2"/>
    
    <text x="0" y="80" class="mind-label" text-anchor="middle" style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5))">YOUR MIND</text>
  </g>

  <g transform="translate(700, 950)">
    <use href="#stone-spout" x="0" y="0"/>
  </g>

  <path d="M 700,1000 L 700,1200" fill="none" stroke="#265C59" stroke-width="30" stroke-linecap="round" opacity="0.8"/>
  <path d="M 700,1000 L 700,1200" fill="none" stroke="#FDFBF7" stroke-width="12" stroke-linecap="round"/>

  <text x="700" y="1280" class="flow-label" text-anchor="middle">what fills the mind flows outward.</text>
</svg>